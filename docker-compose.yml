# Everything runs locally. No business data leaves this compose network:
# LLM + embeddings are served by Ollama, vectors by Qdrant, rows by PostgreSQL.
services:
  # Single uvicorn worker (Dockerfile's CMD passes no --workers): intentional, since conversation history
  # (app/repository/conversation_store.py) is an in-process dict - a second worker/replica would not see
  # another one's sessions. See README "Known limits" before changing this.
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_NUM_CTX: ${CHAT_NUM_CTX:-8192}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL_RO: postgresql://assistant_ro:${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env - see .env.example}@postgres:5432/shop
      DATABASE_URL_RW: postgresql://assistant_rw:${ASSISTANT_RW_PASSWORD:?Set ASSISTANT_RW_PASSWORD in .env - see .env.example}@postgres:5432/shop
      DOCUMENTS_DIR: /srv/data/documents
      AUTO_INGEST: "true"
      RAG_DEBUG: ${RAG_DEBUG:-false}
      API_KEY: ${API_KEY:-}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-20/minute}
      RATE_LIMIT_INGEST: ${RATE_LIMIT_INGEST:-10/minute}
    volumes:
      - ./data/documents:/srv/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  ui:
    build: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: shop
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env - see .env.example}
      ASSISTANT_RW_PASSWORD: ${ASSISTANT_RW_PASSWORD:?Set ASSISTANT_RW_PASSWORD in .env - see .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_admin -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    # Pinned for reproducible builds; bump deliberately (check github.com/qdrant/qdrant/releases).
    image: qdrant/qdrant:v1.12.1
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # No curl/wget in this image; a bare TCP connect is enough to know the API port is accepting
      # connections (api's depends_on used to be `service_started`, which doesn't wait for this at all).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    # Pinned for reproducible builds; bump deliberately (check github.com/ollama/ollama/releases).
    image: ollama/ollama:0.5.4
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    # NVIDIA GPU (optional): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot job: pull the models into the ollama volume (first run downloads, ~5 GB).
  ollama-init:
    image: ollama/ollama:0.5.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${CHAT_MODEL:-llama3.1:8b} && ollama pull ${EMBED_MODEL:-nomic-embed-text}
    restart: "no"

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
